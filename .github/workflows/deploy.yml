name: Deploy

# Deploy only after the main-branch CI workflow succeeds.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: deploy-company-portal
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_DIR=/var/www/company-portal
            cd "$DEPLOY_DIR"

            sudo git fetch origin main
            if sudo git show-ref --verify --quiet refs/heads/main; then
              sudo git checkout main
            else
              sudo git checkout -b main origin/main
            fi
            sudo git pull --ff-only origin main

            sudo npm ci --no-audit --no-fund
            sudo npm run build
            sudo systemctl reload nginx
